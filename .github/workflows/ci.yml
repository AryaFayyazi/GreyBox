name: ci
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix: {python: ["3.10", "3.11", "3.12", "3.13"]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - run: pip install ".[server,text]" pytest httpx anthropic openai      # the real SDK types are tested (content blocks)
      - run: pytest -q tests
  integrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install ".[server,text,claude-agent,openai-agents,langgraph]" pytest      # the real framework SDKs, offline
      - run: pytest -q tests/test_integrations.py
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install ".[server,text]" pandas
      - name: recompute the headline results from the public per-unit release
        run: python scripts/109_recompute_public.py
      - name: catch rates at an exact budget reproduce the committed corrections
        run: python scripts/111_catch_exact_budget.py && git diff --exit-code results/t1/catch_exact_budget.json
      - name: offline baseline gates reproduce
        run: python scripts/112_offline_gates.py && git diff --exit-code results/t1/offline_gates.json
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t greybox -f deploy/Dockerfile .
      - run: |
          docker run -d -p 8000:8000 -v $PWD/site/tests/browser_model.json:/models/text.json -e GB_TEXT_MONITOR=/models/text.json --name gb greybox
          for i in $(seq 1 30); do curl -sf localhost:8000/v1/health && break; sleep 1; done
          curl -sf -X POST localhost:8000/v1/monitor/text -H 'content-type: application/json' \
            -d '{"instructions":"p","task":"t","action":{"tool":"send_message","args":{"to":"y"}}}'
